services:
  contentmanager-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contentmanager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - spcapps-network
    cpus: 1.0
    mem_limit: 1g

  contentmanager-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://content.spcapps.com/api
    container_name: contentmanager-frontend
    restart: unless-stopped
    networks:
      - spcapps-network
    cpus: 0.5
    mem_limit: 512m

networks:
  spcapps-network:
    external: true
